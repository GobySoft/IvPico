app {
  geodesy {
    lat_origin: 43.825300
    lon_origin: -70.330400
  }
  simulation {
    time {
      use_sim_time: true
      warp_factor: 10
    }
  }
}

interprocess {
    platform: "frontseat_sim_example"
}

helm {
  behavior_file: "config/alpha.bhv"
  domain { name: "course" low: 0 high: 359 points: 360 }
  domain { name: "speed" low: 0 high: 4 points: 41 }
}

frontseat {
  enable: true
}
