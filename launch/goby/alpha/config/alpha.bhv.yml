# yaml-language-server: $schema=https://raw.githubusercontent.com/GobySoft/IvPico/main/share/ivpico/bhv.schema.json
# MOOS-IvP's alpha mission: a survey, then a return to 0,-20, as alpha.bhv in
# ivp/missions/s1_alpha. ivpico_bhv convert writes it as a .bhv file.

initialize:
  DEPLOY: false
  RETURN: false

behaviors:
  - type: BHV_Waypoint
    name: waypt_survey
    pwt: 100
    condition:
      - RETURN = false
      - DEPLOY = true
    updates: WPT_UPDATE
    perpetual: true
    endflag:
      - RETURN = true
      - SUMMARY=speed=$[SPEED],time=$[DUR_RUN_TIME]
    activeflag:
      - INFO=$[OWNSHIP]
      - INFO=$[BHVNAME]
      - INFO=$[BHVTYPE]
    configflag: CRUISE_SPD = $[SPEED]
    params:
      cycleflag: CINFO=$[OSX],$[OSY]
      wptflag:
        - PREV=$(PX),$(PY)
        - NEXT=$(NX),$(NY)
        - TEST=$(X),$(Y)
        - OSPOS=$(OSX),$(OSY)
      wptflag_on_start: true
      speed_alt: 1.2
      use_alt_speed: true
      lead: 8
      lead_damper: 1
      lead_to_start: true
      speed: 3
      capture_line: true
      capture_radius: 5.0
      slip_radius: 15.0
      efficiency_measure: all
      polygon: 60,-40:60,-160:150,-160:180,-100:150,-40
      order: normal
      repeat: 0
      visual_hints:
        - nextpt_color=yellow
        - nextpt_vertex_size=8
        - nextpt_lcolor=gray70
        - vertex_color=dodger_blue, edge_color=white
        - vertex_size=5, edge_size=1

  - type: BHV_Waypoint
    name: waypt_return
    pwt: 100
    condition:
      - RETURN = true
      - DEPLOY = true
    updates: RETURN_UPDATE
    perpetual: true
    endflag:
      - RETURN = false
      - DEPLOY = false
      - MISSION = complete
    params:
      speed: 2.0
      capture_radius: 2.0
      slip_radius: 8.0
      points: 0,-20

  - type: BHV_ConstantSpeed
    name: const_speed
    pwt: 200
    condition:
      - SPD=true
      - DEPLOY = true
    updates: SPEED_UPDATE
    duration: 10
    duration_reset: CONST_SPD_RESET=true
    perpetual: true
    endflag: SPD = false
    params:
      speed: 0.5
