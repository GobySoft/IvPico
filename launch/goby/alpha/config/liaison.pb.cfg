app {
  simulation {
    time {
      use_sim_time: true
      warp_factor: 10
    }
  }
}

interprocess {
    platform: "alpha"
}

http_address: "localhost"
http_port: 50001
load_shared_library: "../../../build/usr/lib/libivpico_interface.so"

pb_commander_config {
  sqlite3_database: "/tmp/liaison_commander_autosave.db"
  load_protobuf {
    name: "ivp.interface.Variable"
    publish_to { group: "ivpico::helm::variable" }
  }
  load_protobuf {
    name: "ivp.interface.Command"
    publish_to { group: "ivpico::helm::command" }
  }
}
pb_scope_config {
}
pb_map_config {
  initial_lat: 43.825300
  initial_lon: -70.330400
  initial_zoom: 16
}
