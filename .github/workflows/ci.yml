name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: ./init.sh
      - name: Build
        run: ./build.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build and test without yaml-cpp
        if: matrix.ubuntu == '24.04' && matrix.arch == 'amd64'
        run: |
          BUILD_DIR=build-noyaml ./build.sh -Denable_yaml=OFF
          ctest --test-dir build-noyaml --output-on-failure --no-tests=error \
            -R '^(helm|behavior_file|bhv_schema|closed_loop_s1_alpha_inline)$'
