frontseat_cfg {
  require_helm: true
  helm_running_timeout: 10
  frontseat_connected_timeout: 10
  status_period: 5
  exit_on_error: false
  [goby.middleware.frontseat.protobuf.basic_simulator_config] {
    tcp_address: "127.0.0.1"
    tcp_port: @PORT@
    start {
      lat: 43.8253
      lon: -70.3304
      duration: 0
      control_freq: 10
      vehicle { accel: 1.0 hdg_rate: 50 z_rate: 2 }
    }
  }
}
