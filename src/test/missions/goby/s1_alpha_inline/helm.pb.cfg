helm {
  domain { name: "speed" low: 0 high: 4 points: 41 }
  domain { name: "course" low: 0 high: 359 points: 360 }
  # alpha.bhv, inline
  behaviors {
    initialize { var: "DEPLOY" value: "false" }
    initialize { var: "RETURN" value: "false" }
    behavior {
      type: "BHV_Waypoint"
      name: "waypt_survey"
      pwt: "100"
      condition: "RETURN = false"
      condition: "DEPLOY = true"
      updates: "WPT_UPDATE"
      perpetual: "true"
      endflag: "RETURN = true"
      endflag: "SUMMARY=speed=$[SPEED],time=$[DUR_RUN_TIME]"
      activeflag: "INFO=$[OWNSHIP]"
      activeflag: "INFO=$[BHVNAME]"
      activeflag: "INFO=$[BHVTYPE]"
      configflag: "CRUISE_SPD = $[SPEED]"
      param { key: "cycleflag" value: "CINFO=$[OSX],$[OSY]" }
      param { key: "wptflag" value: "PREV=$(PX),$(PY)" }
      param { key: "wptflag" value: "NEXT=$(NX),$(NY)" }
      param { key: "wptflag" value: "TEST=$(X),$(Y)" }
      param { key: "wptflag" value: "OSPOS=$(OSX),$(OSY)" }
      param { key: "wptflag_on_start" value: "true" }
      param { key: "speed_alt" value: "1.2" }
      param { key: "use_alt_speed" value: "true" }
      param { key: "lead" value: "8" }
      param { key: "lead_damper" value: "1" }
      param { key: "lead_to_start" value: "true" }
      param { key: "speed" value: "3" }
      param { key: "capture_line" value: "true" }
      param { key: "capture_radius" value: "5.0" }
      param { key: "slip_radius" value: "15.0" }
      param { key: "efficiency_measure" value: "all" }
      param { key: "polygon" value: "60,-40:60,-160:150,-160:180,-100:150,-40" }
      param { key: "order" value: "normal" }
      param { key: "repeat" value: "0" }
      param { key: "visual_hints" value: "nextpt_color=yellow" }
      param { key: "visual_hints" value: "nextpt_vertex_size=8" }
      param { key: "visual_hints" value: "nextpt_lcolor=gray70" }
      param { key: "visual_hints" value: "vertex_color=dodger_blue, edge_color=white" }
      param { key: "visual_hints" value: "vertex_size=5, edge_size=1" }
    }
    behavior {
      type: "BHV_Waypoint"
      name: "waypt_return"
      pwt: "100"
      condition: "RETURN = true"
      condition: "DEPLOY = true"
      updates: "RETURN_UPDATE"
      perpetual: "true"
      endflag: "RETURN = false"
      endflag: "DEPLOY = false"
      endflag: "MISSION = complete"
      param { key: "speed" value: "2.0" }
      param { key: "capture_radius" value: "2.0" }
      param { key: "slip_radius" value: "8.0" }
      param { key: "points" value: "0,-20" }
    }
    behavior {
      type: "BHV_ConstantSpeed"
      name: "const_speed"
      pwt: "200"
      condition: "SPD=true"
      condition: "DEPLOY = true"
      updates: "SPEED_UPDATE"
      duration: "10"
      duration_reset: "CONST_SPD_RESET=true"
      perpetual: "true"
      endflag: "SPD = false"
      param { key: "speed" value: "0.5" }
    }
  }
}
frontseat { enable: true }
