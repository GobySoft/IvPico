# m2_berta: abe loiters while ben, a ghost replayed from the recording, passes
# through; abe's avdcol_ behavior spawns from the helm's own contact alert.
# Times are real seconds: a tenth of mission time. The ghost fixture runs in
# this directory, the others in the one above.
include: [../closed_loop.yml]

fixture:
  - name: ghost
    command: cat ../common.pb.cfg ghost.pb.cfg | ${GHOST} -
    env: ['GOBY_INTERPROCESS=platform: "ivpico_${MISSION}"']

test:
  name: m2_berta closed loop
  run:
    - name: mission
      mode: PARALLEL
      step:
        - name: deploy
          publish:
            - group: ivpico::helm::variable
              type: PROTOBUF/ivp.interface.Variable
              value: 'key: "DEPLOY" sval: "true"'
              delay: 0.5
            - group: ivpico::helm::variable
              type: PROTOBUF/ivp.interface.Variable
              value: 'key: "MOOS_MANUAL_OVERRIDE" sval: "false"'
              delay: 0.5
          expect:
            # recorded at 380 s of mission time
            - group: ivpico::helm::life_event
              type: ivp.interface.LifeEvent
              match: 'type: SPAWN behavior: "avdcol_ben"'
              timeout: 48
        - name: meets ben
          expect:
            - group: ivpico::test::ghost_range
              type: ivp.interface.Variable
              condition: [{ field: dval, op: LT, value: "100" }]
              timeout: 48
        - name: keeps clear of ben
          expect:
            - group: ivpico::test::ghost_range
              type: ivp.interface.Variable
              condition: [{ field: dval, op: LT, value: "10" }]
              count: 0
              timeout: 50
        - name: no errors
          expect:
            - group: ivpico::helm::status
              type: ivp.interface.Status
              condition: [{ field: state, op: EQ, value: MALCONFIG }]
              count: 0
              timeout: 50
            - group: ivpico::helm::status
              type: ivp.interface.Status
              condition: [{ field: allstop, op: EQ, value: BEHAVIOR_ERROR }]
              count: 0
              timeout: 50
