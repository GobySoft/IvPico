helm {
  behavior_file: "../fixtures/m2_berta.abe/targ_abe.bhv"
  domain { name: "course" low: 0 high: 359 points: 360 }
  domain { name: "speed" low: 0 high: 2 points: 21 }
  contact_manager {
    alert: "id=avdcol_, var=CONTACT_INFO, val=\"name=$[VNAME] # contact=$[VNAME]\""
    alert: "id=avdcol_, alert_range=15, cpa_range=5"
    contact_max_age: 35
    decay_start: 30
    decay_end: 60
    hold_alerts_for_helm: true
    disable_var: "XYZ_DISABLE_TARGET"
    enable_var: "XYZ_REENABLE_TARGET"
  }
}
frontseat { enable: true }
