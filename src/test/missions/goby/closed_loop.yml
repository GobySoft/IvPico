# Fixtures and startup for the closed-loop mission tests (<mission>/test.yml):
# goby_helm_ivp flies the mission's recorded .bhv against Goby's basic
# frontseat simulator with time warp 10, so test times are a tenth of mission
# time. Each test continues once the frontseat and helm are running.
#
# Set with -D: MISSION, PORT (simulator), HELM (goby_helm_ivp),
# INTERFACE_LIB (libivpico_interface.so)
load_shared_library: ["${INTERFACE_LIB}"]

endpoint:
  - { name: vehicle, zeromq: { platform: "ivpico_${MISSION}" } }

fixture:
  - name: gobyd
    command: gobyd common.pb.cfg -v
    env: ['GOBY_INTERPROCESS=platform: "ivpico_${MISSION}"']
    ready: { output_regex: "gobyd is ready" }
  - name: simulator
    command: goby_basic_frontseat_simulator ${PORT}
  - name: frontseat
    command: cat common.pb.cfg frontseat.pb.cfg | sed "s/@PORT@/${PORT}/" | goby_frontseat_interface_basic_simulator -
    env: ['GOBY_INTERPROCESS=platform: "ivpico_${MISSION}"']
  - name: helm
    command: cat common.pb.cfg ${MISSION}/helm.pb.cfg | ${HELM} -
    env: ['GOBY_INTERPROCESS=platform: "ivpico_${MISSION}"']

test:
  require_app: [{ name: [goby_frontseat_interface, goby_helm_ivp] }]
  run:
    - name: frontseat and helm running
      timeout: 10
      expect:
        - group: goby::middleware::frontseat::node_status
          type: goby.middleware.frontseat.protobuf.NodeStatus
        - group: ivpico::helm::status
          type: ivp.interface.Status
          condition: [{ field: state, op: REGEX, value: "^(PARK|DRIVE)$" }]
