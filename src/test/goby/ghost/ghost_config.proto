syntax = "proto2";

import "goby/middleware/protobuf/app_config.proto";
import "goby/zeromq/protobuf/interprocess_config.proto";
import "goby/protobuf/option_extensions.proto";

package ivpico.goby.protobuf;

message GhostConfig
{
    optional .goby.middleware.protobuf.AppConfig app = 1;
    optional .goby.zeromq.protobuf.InterProcessPortalConfig interprocess = 2;

    required string alog = 10 [(.goby.field).description = "xz-compressed alog with the contacts' NODE_REPORTs"];
    repeated string vehicle = 11 [(.goby.field).description = "Contacts to replay (NODE_REPORT NAME)"];
}
